name: Build Kirin 9010 (charlotte) kernel

on:
  push:
    branches:
      - charlotte-7.3
      - 261110-feat-kirin9010-kernel
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          # The image ships most of these already; the cross toolchain and
          # dtc come from apt.  The hosted runner's resolver has been
          # failing on the Ubuntu mirrors, so pin the canonical addresses
          # for this step; drop the pins once the resolver recovers.
          echo "91.189.91.83 archive.ubuntu.com" | sudo tee -a /etc/hosts
          echo "91.189.92.23 security.ubuntu.com" | sudo tee -a /etc/hosts
          echo "91.189.91.83 azure.archive.ubuntu.com" | sudo tee -a /etc/hosts
          sudo timeout 180 apt-get -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 -o Acquire::Retries=1 update || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 900 apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler cpio rsync xz-utils

      - name: Configure for MRO-W00
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- charlotte_mro_defconfig

      - name: Build Image and device trees
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image dtbs

      - name: Embed device tree into Image
        run: |
          mkdir -p out
          python3 tools/charlotte/embed_dtb.py \
            --image arch/arm64/boot/Image \
            --dtb arch/arm64/boot/dts/hisilicon/charlotte-mro-w00.dtb \
            --out out/Image-7.3-mro-w00-dtb > out/Image-7.3-mro-w00-dtb.info.txt
          cat out/Image-7.3-mro-w00-dtb.info.txt
          python3 tools/charlotte/embed_dtb.py \
            --image arch/arm64/boot/Image \
            --dtb arch/arm64/boot/dts/hisilicon/charlotte-tgr-w00.dtb \
            --out out/Image-7.3-tgr-w00-dtb > out/Image-7.3-tgr-w00-dtb.info.txt
          cat out/Image-7.3-tgr-w00-dtb.info.txt

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/Image-7.3-mro-w00
          cp arch/arm64/boot/dts/hisilicon/charlotte-mro-w00.dtb out/
          cp arch/arm64/boot/dts/hisilicon/charlotte-tgr-w00.dtb out/
          cp System.map out/System.map-7.3-mro-w00
          cp .config out/config-mro-w00
          (cd out && sha256sum * > SHA256SUMS.txt && ls -l)

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kirin9010-mro-w00-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

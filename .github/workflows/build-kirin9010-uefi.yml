name: Build Kirin 9010 UEFI

on:
  push:
    branches: ["261118-feat-kirin9010-uefi"]
    paths:
      - "uefi/**"
      - ".github/workflows/build-kirin9010-uefi.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CI_BUILD: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev nasm lld clang gcc-aarch64-linux-gnu python3 python3-pip

      - name: Install python dependencies
        working-directory: uefi
        run: python3 -m pip install --break-system-packages -r pip-requirements.txt

      - name: Fetch Mu / EDK2 dependencies
        working-directory: uefi
        run: |
          git clone --depth 1 -b release/202608 https://github.com/microsoft/mu_basecore.git Mu_Basecore
          git clone --depth 1 -b release/202608 https://github.com/microsoft/mu_plus.git Common/Mu
          git clone --depth 1 -b release/202608 https://github.com/microsoft/mu_oem_sample.git Common/Mu_OEM_Sample
          git clone --depth 1 https://github.com/Project-Silicium/Silicium-ACPI.git Silicium-ACPI
          # The pinned revision is a commit hash, fetch it explicitly instead of -b
          mkdir -p Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl
          git -C Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl init -q
          git -C Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl remote add origin https://github.com/openssl/openssl.git
          # Secure Boot is disabled, so a missing pin must not fail the build
          if git -C Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl fetch -q --depth 1 origin 67b5686b4419b4cb8caa502711c41815f5279751; then
            git -C Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl checkout -q FETCH_HEAD
          else
            echo "warning: unable to fetch openssl pin, continuing"
          fi

      - name: Build UEFI
        working-directory: uefi
        run: python3 build_uefi.py -d mro -r DEBUG -c

      - name: Upload UEFI images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-mro
          path: |
            uefi/Mu-mro*.img
            uefi/Mu-mro*.bin
            uefi/Build/mroPkg/*/FV/*.fd
          if-no-files-found: warn

name: Build Kirin 9010 UEFI

on:
  push:
    branches: ["261118-feat-kirin9010-uefi"]
    paths:
      - "uefi/**"
      - ".github/workflows/build-kirin9010-uefi.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CI_BUILD: true
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y uuid-dev nasm lld clang llvm binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu mono-devel python3 python3-pip

      - name: Install python dependencies
        working-directory: uefi
        run: python3 -m pip install --break-system-packages -r pip-requirements.txt

      - name: Fetch Mu / EDK2 dependencies
        working-directory: uefi
        run: |
          # The reference tree pins every dependency by commit hash
          fetch_pinned() {
            local path="$1" url="$2" sha="$3"
            [ -d "${path}/.git" ] && return 0
            mkdir -p "${path}"
            git -C "${path}" init -q
            git -C "${path}" remote add origin "${url}"
            if ! git -C "${path}" fetch -q --depth 1 origin "${sha}"; then
              git -C "${path}" fetch -q origin
            fi
            git -C "${path}" checkout -q "${sha}"
          }

          fetch_pinned Mu_Basecore https://github.com/microsoft/mu_basecore.git cfb93724a06ff86ff5ba971413368a7809ee42a5
          fetch_pinned Common/Mu https://github.com/microsoft/mu_plus.git b8d46c71610318e36a661819e1e3c0b8bdda413a
          fetch_pinned Common/Mu_OEM_Sample https://github.com/microsoft/mu_oem_sample.git b70b4b7bb02c43bf9db2172dfb3ed0457e2361d6
          fetch_pinned Silicium-ACPI https://github.com/Project-Silicium/Silicium-ACPI.git 2d465ad77c25de908f0ec7bdfcb57f865b61233c
          fetch_pinned Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl https://github.com/openssl/openssl.git 67b5686b4419b4cb8caa502711c41815f5279751

          # mu_basecore .dec files reference submodule include trees
          for dep in Mu_Basecore Common/Mu Common/Mu_OEM_Sample; do
            git -C "${dep}" submodule update --init --recursive --depth 1
          done

      - name: Build UEFI
        working-directory: uefi
        run: python3 build_uefi.py -d mro -r DEBUG -c

      - name: Pack the boot image
        working-directory: uefi
        run: ./pack_boot.sh

      - name: Upload UEFI images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uefi-mro
          path: |
            uefi/Mu-mro.bin
            uefi/Mu-mro-boot.img
            uefi/Image
            uefi/Build/mroPkg/*/FV/*.fd
          if-no-files-found: warn

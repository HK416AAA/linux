name: Build Kirin 9010 Ubuntu userspace

on:
  push:
    branches:
      - 261110-feat-kirin9010-ubuntu
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          # The image ships most of these already; the cross toolchain and
          # dtc come from apt.  The hosted runner's resolver has been
          # failing on the Ubuntu mirrors, so pin the canonical addresses
          # for this step; drop the pins once the resolver recovers.
          echo "91.189.91.83 archive.ubuntu.com" | sudo tee -a /etc/hosts
          echo "91.189.92.23 security.ubuntu.com" | sudo tee -a /etc/hosts
          echo "91.189.91.83 azure.archive.ubuntu.com" | sudo tee -a /etc/hosts
          sudo timeout 180 apt-get -o Acquire::http::Timeout=10 \
            -o Acquire::https::Timeout=10 -o Acquire::Retries=1 update || true
          sudo DEBIAN_FRONTEND=noninteractive timeout 900 apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            device-tree-compiler cpio gzip xz-utils kmod \
            debootstrap qemu-user-static binfmt-support e2fsprogs
          sudo DEBIAN_FRONTEND=noninteractive timeout 300 apt-get install -y \
            android-sdk-libsparse-utils \
            || echo "simg2img unavailable, in-process sparse check only"

      - name: Enable arm64 binfmt
        run: |
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo systemctl restart systemd-binfmt || true
          ls /proc/sys/fs/binfmt_misc/ || true

      - name: Build kernel and modules
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- charlotte_mro_defconfig
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j"$(nproc)" Image dtbs modules
          echo "KERNEL_RELEASE=$(make -s ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- kernelrelease)" >> "$GITHUB_ENV"

      - name: Build Ubuntu initramfs
        run: |
          sudo -E env \
            KERNEL_SRC="$PWD" \
            KERNEL_RELEASE="$KERNEL_RELEASE" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            bash tools/ubuntu-initramfs-maker/build.sh

      - name: Convert initramfs to ext4 and sparse image
        run: |
          IMG_DIR=tools/ubuntu-initramfs-maker/out
          sudo python3 tools/ubuntu-initramfs-maker/cpio2ext4.py \
            --cpio "$IMG_DIR/charlotte-ubuntu-24.04.cpio.gz" \
            --raw-out /tmp/charlotte-ubuntu-24.04.ext4 \
            --sparse-out "$IMG_DIR/charlotte-ubuntu-24.04.ext4.sparse" \
            --label charlotte-root \
            --workdir /tmp/cpio2ext4-work
          ls -l "$IMG_DIR"

      - name: Pack the rescue ramdisk
        run: |
          mkdir -p out
          sudo bash tools/charlotte/initramfs/pack.sh out/charlotte-rescue.cpio.gz
          python3 tools/charlotte/mkbootimg.py \
            --ramdisk out/charlotte-rescue.cpio.gz \
            --out out/charlotte-ramdisk.img

      - name: Embed device tree into Image
        run: |
          mkdir -p out
          python3 tools/charlotte/embed_dtb.py \
            --image arch/arm64/boot/Image \
            --dtb arch/arm64/boot/dts/hisilicon/charlotte-mro-w00.dtb \
            --out out/Image-7.3-mro-w00-dtb > out/Image-7.3-mro-w00-dtb.info.txt
          cat out/Image-7.3-mro-w00-dtb.info.txt
          python3 tools/charlotte/embed_dtb.py \
            --image arch/arm64/boot/Image \
            --dtb arch/arm64/boot/dts/hisilicon/charlotte-tgr-w00.dtb \
            --out out/Image-7.3-tgr-w00-dtb > out/Image-7.3-tgr-w00-dtb.info.txt
          cat out/Image-7.3-tgr-w00-dtb.info.txt

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp arch/arm64/boot/Image out/Image-7.3-mro-w00
          cp arch/arm64/boot/dts/hisilicon/charlotte-mro-w00.dtb out/
          cp arch/arm64/boot/dts/hisilicon/charlotte-tgr-w00.dtb out/
          cp System.map "out/System.map-$KERNEL_RELEASE"
          cp .config out/config-mro-w00
          cp tools/ubuntu-initramfs-maker/out/* out/
          (cd out && sha256sum * > SHA256SUMS.txt && ls -l)

      - name: Upload userspace artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kirin9010-ubuntu-${{ github.sha }}
          path: out/*
          if-no-files-found: error
          retention-days: 30

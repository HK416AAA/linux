#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Must match the "UEFI FD" region in
# Platforms/Hisilicon/mroPkg/Library/MemoryMapLib/MemoryMapLib.c
#
[uefi_fd]
base = 0x9FC00000
size = 0x300000

#
# Payload Output Configs
#
# Emit the raw "Image" style payload: the boot shim with the firmware FD
# appended. pack_boot.sh wraps it into an Android boot image.
#
[payload]
type = "raw"
